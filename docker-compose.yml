# BuddyBird MBTI — Next standalone container behind the existing Caddy (ADR-0002).
# Fixed project name so the compose project is stable regardless of the checkout
# path the deploy runs from.
name: buddybird-mbti

services:
    web:
        build:
            context: .
            # Firebase web config, inlined at build time (ADR-0011). Compose reads
            # the values from a .env file next to this compose file on the server.
            # Missing values fall back to empty → Firebase disabled (console sink).
            args:
                NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
                NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
                NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
                NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
                NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
                NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
                NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:-}
        image: buddybird-mbti-web:latest
        container_name: buddybird-mbti-web
        restart: unless-stopped
        # No host port publish — the existing Caddy reaches the container over the
        # shared `proxy` network via its container name (buddybird-mbti-web:3000).
        expose:
            - '3000'
        networks:
            - proxy
        healthcheck:
            # 127.0.0.1 (not localhost): server binds IPv4 0.0.0.0; localhost → ::1.
            # Trailing slash is canonical under trailingSlash:true.
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/healthz/']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

networks:
    # Pre-existing bridge network the Caddy reverse proxy already runs on.
    proxy:
        external: true
