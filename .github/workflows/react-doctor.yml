# React Doctor PR scan — reports only the issues a PR introduces (Codecov-style
# baseline), posts a sticky summary + inline review comments, and fails the
# check on new warnings so existing debt can be paid down incrementally.
# Setup guide: https://react.doctor/docs/ci-and-prs/github-actions-setup
name: React Doctor

on:
    pull_request:

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  # Full history so React Doctor can diff against the base branch.
                  fetch-depth: 0
            - uses: millionco/react-doctor@v2
              with:
                  # Most React Doctor rules are warn-severity; block on those too so
                  # new PRs stay clean (pre-existing issues in untouched files are
                  # never blamed on the PR).
                  blocking: warning
