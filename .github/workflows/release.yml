name: release

on:
    push:
        branches: [main]

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
        steps:
            - uses: googleapis/release-please-action@v5
              id: release
              with:
                  release-type: node
                  target-branch: main

    deploy:
        needs: release
        if: needs.release.outputs.release_created
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/deploy.yml
        secrets: inherit
